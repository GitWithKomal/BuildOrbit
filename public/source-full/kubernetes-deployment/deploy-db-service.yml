apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-db-service
  labels:
    app: webapp-db-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-db-service
  template:
    metadata:
      labels:
        app: webapp-db-service
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: "users"
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-db-service
spec:
  selector:
    app: webapp-db-service
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP
