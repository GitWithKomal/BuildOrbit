apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-backend-service
  labels:
    app: webapp-backend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-backend-service
  template:
    metadata:
      labels:
        app: webapp-backend-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/webapp-backend-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "mongodb://REDACTED"
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-backend-service
spec:
  selector:
    app: webapp-backend-service
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
