name: Deploy Frontend Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "multi-service-app/webapp-frontend-service/**"
      - "kubernetes-deployment/deploy-frontend-service.yml"
      - ".github/workflows/deploy-frontend.yml"

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: mycluster
  ECR_REPOSITORY: webapp-frontend-service
  ECR_REGISTRY: AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log In to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Docker Image
        working-directory: multi-service-app/webapp-frontend-service
        run: |
          docker build -t $ECR_REPOSITORY:latest .
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy Frontend to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          aws --version
          aws sts get-caller-identity

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Verify EKS Connection
        run: |
          echo "Current Context:"
          kubectl config current-context

          echo "Cluster Info:"
          kubectl cluster-info

          echo "Nodes:"
          kubectl get nodes

      - name: Deploy Application
        run: |
          kubectl apply -f kubernetes-deployment/deploy-frontend-service.yml

          kubectl rollout restart deployment/$ECR_REPOSITORY

          kubectl rollout status deployment/$ECR_REPOSITORY --timeout=300s
