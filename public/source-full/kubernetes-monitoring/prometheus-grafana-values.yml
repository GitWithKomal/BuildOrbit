# Helm values customization for kube-prometheus-stack deployment on EKS
# Reference: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

prometheus:
  prometheusSpec:
    # Enable automatic discovery of Pods with prometheus.io annotations
    additionalScrapeConfigs:
      - job_name: 'kubernetes-pods-autodiscover'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

grafana:
  # Enable and configure LoadBalancer to access Grafana UI from the internet
  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000

  # Admin credentials for initial login
  adminUser: admin
  adminPassword: "REPLACE_WITH_GRAFANA_PASSWORD"
